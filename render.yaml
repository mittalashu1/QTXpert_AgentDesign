services:
  - type: web
    name: qtxpert-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: POSTGRES_URL
        # Neon is the production database. Keep the value in Render's secret
        # environment rather than creating a second Render Postgres instance.
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: DB_COMMAND_TIMEOUT_SECONDS
        value: "60"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "15"
      - key: UPLOAD_STORAGE_BACKEND
        # Switch to object_store only after the bucket credentials are set.
        value: postgres_chunks
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_PREFIX
        value: qtxpert
      - key: OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS
        value: "900"
      - key: OBJECT_STORAGE_MULTIPART_THRESHOLD_MB
        value: "16"
      - key: OBJECT_STORAGE_PART_SIZE_MB
        value: "16"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: router
      - key: LLM_ROUTER_LOW_COST
        value: gemini:gemini-2.5-flash-lite,azure_openai:configured
      - key: LLM_ROUTER_STANDARD
        value: gemini:gemini-2.5-flash,azure_openai:configured
      - key: LLM_ROUTER_COMPLEX
        value: azure_openai:configured
      - key: LLM_ROUTER_FALLBACK
        value: azure_openai:configured
      - key: LLM_COST_RATES_JSON
        value: '{"gemini:gemini-2.5-flash-lite":{"input":0.10,"output":0.40},"gemini:gemini-2.5-flash":{"input":0.30,"output":2.50}}'
      - key: CORS_ORIGINS
        value: https://design.qtxpert.com,https://qtxpert-frontend.onrender.com
      # Set the remaining provider/integration keys (AZURE_OPENAI_API_KEY,
      # AZURE_ENDPOINT, OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY,
      # AWS_*, PINECONE_*, JIRA_*, CONFLUENCE_*) as secrets in the Render
      # dashboard - they are intentionally not templated here.

  - type: web
    name: qtxpert-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    # The static frontend can use the free tier; keep paid capacity focused
    # on the backend/worker that performs Autopilot analysis.
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://qtxpert-backend.onrender.com/api/v1
