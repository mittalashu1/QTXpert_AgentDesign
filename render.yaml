services:
  - type: web
    # Match the existing production service name so a future Blueprint sync
    # updates it instead of creating a second billable service.
    name: QTXpert_AgentDesign_Backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: POSTGRES_URL
        # Neon is the production database. Keep the value in Render's secret
        # environment rather than creating a second Render Postgres instance.
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: DB_COMMAND_TIMEOUT_SECONDS
        value: "60"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "15"
      - key: DB_POOL_RECYCLE_SECONDS
        # Recycle idle Neon sockets before a sleeping/failover connection can
        # fail while FastAPI is closing a request-scoped session.
        value: "300"
      - key: DB_CLOSE_TIMEOUT_SECONDS
        # Cleanup is bounded so a dead Neon connection cannot turn a handled
        # request error into an unhandled 500 during dependency finalization.
        value: "5"
      - key: UPLOAD_STORAGE_BACKEND
        # APKs and evidence live in the configured private R2 bucket.
        value: object_store
      - key: MAX_UPLOAD_SIZE_MB
        # BRDs and other readable documents stay bounded independently from
        # mobile application packages.
        value: "25"
      - key: AUTOPILOT_MAX_UPLOAD_SIZE_MB
        # Shared by Autopilot and Design when an APK/IPA is supplied as the
        # product under test. Keep this explicit so Blueprint syncs cannot
        # accidentally restore the old 25 MB document limit.
        value: "300"
      - key: AUTOPILOT_DB_RETRY_ATTEMPTS
        value: "2"
      - key: AUTOPILOT_DB_RETRY_BACKOFF_SECONDS
        value: "0.25"
      - key: AUTOPILOT_DEEP_PARSE_MAX_MB
        # Keep the in-process Androguard parser within the web instance memory
        # envelope. Builds up to 300 MB are still accepted and use bounded ZIP
        # metadata until a dedicated analysis worker is configured.
        value: "64"
      - key: AUTOPILOT_LOCAL_STAGING_TTL_SECONDS
        # Remove only abandoned .part/.tmp files; durable manifests, analyses
        # and repository source assets are never deleted by this sweep.
        value: "3600"
      - key: AUTOPILOT_DISCOVERY_SETTLE_SECONDS
        value: "4"
      - key: AUTOPILOT_DISCOVERY_SETTLE_RETRIES
        value: "3"
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_PREFIX
        value: qtxpert
      - key: OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS
        value: "900"
      - key: OBJECT_STORAGE_MULTIPART_THRESHOLD_MB
        value: "16"
      - key: OBJECT_STORAGE_PART_SIZE_MB
        value: "16"
      - key: JWT_SECRET
        # Keep the signing key stable across Blueprint syncs and deployments.
        # Set the secret once in Render; never regenerate it automatically.
        sync: false
      - key: APP_ENV
        value: production
      - key: AUTOPILOT_RECOVERY_ENABLED
        # Web instances must not replay large APK jobs during a deploy.
        value: "false"
      - key: DATA_RETENTION_ENABLED
        # Cleanup is admin-confirmed; keep automatic deletion disabled until
        # the Neon backup/restore policy has been reviewed.
        value: "false"
      - key: DATA_RETENTION_DAYS
        value: "7"
      - key: DATA_RETENTION_KEEP_LATEST
        value: "3"
      - key: DATA_RETENTION_INCLUDE_EPHEMERAL_ASSETS
        value: "true"
      - key: DATA_RETENTION_RUN_ON_STARTUP
        value: "false"
      - key: COST_CENTER_AUTO_REFRESH_ENABLED
        value: "true"
      - key: COST_CENTER_REFRESH_DAYS
        value: "30"
      - key: COST_CENTER_REFRESH_TIMEOUT_SECONDS
        value: "8"
      # Optional account-level plan/usage connectors. Store the values only in
      # Render's secret environment; QTXpert persists metrics, never tokens.
      - key: NEON_API_KEY
        sync: false
      - key: NEON_ORG_ID
        sync: false
      - key: NEON_PLAN
        # Current workspace plan from the Neon console; update this label if
        # the account is moved to Scale or another plan.
        value: Launch
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: RENDER_BACKEND_PLAN
        value: Starter
      - key: RENDER_FRONTEND_PLAN
        value: Free
      - key: LLM_PROVIDER
        value: router
      - key: LLM_ROUTER_LOW_COST
        value: gemini:gemini-3.5-flash-lite,azure_openai:configured
      - key: LLM_ROUTER_STANDARD
        value: gemini:gemini-3.5-flash,azure_openai:configured
      - key: LLM_ROUTER_COMPLEX
        value: azure_openai:configured
      - key: LLM_ROUTER_FALLBACK
        value: azure_openai:configured
      - key: LLM_COST_RATES_JSON
        value: '{"gemini:gemini-3.5-flash-lite":{"input":0.30,"output":2.50},"gemini:gemini-3.5-flash":{"input":1.50,"output":9.00}}'
      # Optional AWS CloudWatch Application Signals/X-Ray APM. The backend
      # keeps this disabled until a scoped AWS telemetry role and pre-created
      # CloudWatch log group/stream are supplied in Render secrets.
      - key: AWS_APM_ENABLED
        value: "false"
      - key: AWS_APM_SERVICE_NAME
        value: qtxpert-backend
      - key: AWS_APM_ENVIRONMENT
        value: production
      - key: AWS_APM_TRACE_SAMPLE_RATIO
        value: "0.05"
      - key: AWS_APM_LOG_GROUP
        sync: false
      - key: AWS_APM_LOG_STREAM
        sync: false
      - key: CORS_ORIGINS
        value: https://qtxpert-agentdesign.onrender.com,https://design.qtxpert.com,https://qtxpert-frontend.onrender.com
      # Set the remaining provider/integration keys (AZURE_OPENAI_API_KEY,
      # AZURE_ENDPOINT, OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY,
      # AWS_*, PINECONE_*, JIRA_*, CONFLUENCE_*) as secrets in the Render
      # dashboard - they are intentionally not templated here.

  - type: web
    # Match the existing production service name; do not create a duplicate
    # frontend when the Blueprint is synchronized.
    name: QTXpert_AgentDesign
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    # The static frontend can use the free tier; keep paid capacity focused
    # on the backend/worker that performs Autopilot analysis.
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://qtxpert-agentdesign-backend.onrender.com/api/v1

