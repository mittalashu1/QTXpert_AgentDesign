<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede5ff" stop-opacity=".58"/>
      <stop offset=".48" stop-color="#eaf3ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#f3edff" stop-opacity=".46"/>
    </linearGradient>
    <linearGradient id="water-sheet" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".36" stop-color="#ffffff" stop-opacity=".66"/>
      <stop offset=".54" stop-color="#c4b5fd" stop-opacity=".25"/>
      <stop offset=".74" stop-color="#ffffff" stop-opacity=".56"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".42"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity=".30"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pearl" cx="34%" cy="26%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".90"/>
      <stop offset=".38" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".72" stop-color="#c4b5fd" stop-opacity=".17"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-strong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blur-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .qtx-orb { transform-box: fill-box; transform-origin: center; }
      .qtx-violet { animation: qtx-violet-drift 28s ease-in-out infinite alternate; }
      .qtx-mint { animation: qtx-mint-drift 22s ease-in-out infinite alternate; }
      .qtx-ripple { animation: qtx-ripple-breathe 12s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes qtx-violet-drift {
        from { transform: translate(-32px, -18px) scale(.96); }
        to { transform: translate(42px, 28px) scale(1.08); }
      }
      @keyframes qtx-mint-drift {
        from { transform: translate(28px, 18px) scale(1.04); }
        to { transform: translate(-36px, -24px) scale(.92); }
      }
      @keyframes qtx-ripple-breathe {
        from { opacity: .48; transform: scale(.985); }
        to { opacity: .88; transform: scale(1.025); }
      }
      @media (prefers-reduced-motion: reduce) {
        .qtx-orb, .qtx-ripple { animation: none; }
      }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#F8FAFF"/>
  <rect width="1600" height="1000" fill="url(#wash)" opacity=".30"/>
  <g class="qtx-orb qtx-violet" filter="url(#blur-strong)">
    <circle class="qtx-orb" cx="220" cy="80" r="280" fill="url(#violet)"/>
    <circle class="qtx-orb" cx="1330" cy="860" r="360" fill="url(#violet)" opacity=".78"/>
  </g>
  <g class="qtx-orb qtx-mint" filter="url(#blur-strong)">
    <circle cx="1360" cy="160" r="220" fill="url(#mint)"/>
    <circle cx="520" cy="910" r="290" fill="url(#mint)" opacity=".76"/>
  </g>
  <path d="M-90 650 C210 520 430 760 760 640 C1030 542 1250 590 1690 430 L1690 1000 L-90 1000Z" fill="url(#water-sheet)" opacity=".36" filter="url(#blur-soft)"/>
  <g class="qtx-ripple" fill="none">
    <ellipse cx="1190" cy="420" rx="350" ry="132" stroke="#a78bfa" stroke-opacity=".38" stroke-width="2"/>
    <ellipse cx="1190" cy="420" rx="292" ry="108" stroke="#ffffff" stroke-opacity=".86" stroke-width="3"/>
    <ellipse cx="1190" cy="420" rx="222" ry="82" stroke="#a78bfa" stroke-opacity=".34" stroke-width="1.5"/>
    <ellipse cx="1190" cy="420" rx="164" ry="58" stroke="#ffffff" stroke-opacity=".80" stroke-width="2"/>
    <ellipse cx="1190" cy="420" rx="108" ry="38" stroke="#a78bfa" stroke-opacity=".30" stroke-width="1"/>
  </g>
  <g fill="none" stroke="url(#water-sheet)" stroke-linecap="round">
    <path d="M520 300 C680 230 820 250 960 320 C1090 385 1250 390 1410 322" stroke-width="22" opacity=".46" filter="url(#blur-soft)"/>
    <path d="M600 312 C760 264 868 278 980 334 C1112 400 1248 394 1372 346" stroke-width="3" opacity=".92"/>
    <path d="M110 720 C284 640 420 690 560 742 C695 792 826 778 960 710" stroke-width="3" opacity=".62"/>
  </g>
  <ellipse cx="1200" cy="420" rx="430" ry="195" fill="url(#pearl)" opacity=".22"/>
</svg>
